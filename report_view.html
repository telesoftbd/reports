<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Fit Certificate</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Arial','Helvetica',sans-serif;background:#eef1f3;color:#111}
  
  .bar{background:#003d6c url(header_banner.png) left center/auto 100% no-repeat;color:#fff;padding:0 20px;height:60px;display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:10px;position:relative}
  
  .version-label{position:absolute;left:20px;font-size:10px;font-family:'Consolas','monospace';color:rgba(255,255,255,.7);font-weight:600;letter-spacing:0.5px}
  
  .bar .id{font-family:'Consolas','monospace';background:rgba(255,255,255,.16);padding:4px 10px;border-radius:12px;font-size:12px}
  .bar .date{font-family:'Consolas','monospace';background:rgba(255,255,255,.16);padding:4px 10px;border-radius:12px;font-size:12px}
  
  .toolbar{background:#fff;border-bottom:1px solid #cfd4d8;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .toolbar .status{font-size:13px;color:#555;font-family:'Arial','Helvetica',sans-serif}
  .toolbar .status b{color:#0e5a35;font-weight:700}
  
  .toolbar-buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  
  .btn{background:#0e5a35;color:#fff;border:0;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;display:inline-block;transition:opacity 0.3s ease}
  .btn.ghost{background:#fff;color:#0e5a35;border:1px solid #0e5a35}
  .btn:hover{opacity:.92}
  
  .btn-image{background:none;border:none;padding:0;cursor:pointer;display:inline-block;height:36px;transition:transform 0.2s ease}
  .btn-image:hover{transform:scale(1.05)}
  .btn-image img{height:100%;width:auto;display:block}
  
  .wrap{max-width:1000px;margin:16px auto;padding:0 12px 30px}
  .paper{background:#fff;border:1px solid #cfd4d8;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:10px;text-align:center}
  .paper img{max-width:100%;height:auto;display:block;margin:0 auto}
  
  .err{background:#fff;border:1px solid #f0c8c8;color:#8a2c2c;padding:20px;border-radius:6px;text-align:center;max-width:520px;margin:60px auto}
  
  /* Responsive Design */
  @media (max-width:768px){
    .bar{padding:0 15px;height:70px;gap:5px}
    .version-label{font-size:9px;left:15px}
    .bar .id{font-size:11px;padding:3px 8px}
    .bar .date{font-size:11px;padding:3px 8px}
    
    .toolbar{padding:8px 15px;flex-direction:column;align-items:flex-start;gap:8px}
    .toolbar .status{font-size:12px}
    .toolbar-buttons{width:100%;justify-content:flex-start}
    .btn-image{height:32px}
    
    .wrap{padding:0 10px 20px;margin:12px auto}
    .paper{padding:8px}
  }
  
  @media (max-width:480px){
    .bar{padding:0 10px;height:65px}
    .version-label{font-size:8px;left:10px}
    .bar .id{font-size:10px;padding:2px 6px}
    .bar .date{font-size:10px;padding:2px 6px}
    
    .toolbar{padding:6px 10px}
    .toolbar .status{font-size:11px}
    .toolbar-buttons{flex-direction:column;width:100%;gap:6px}
    .btn{font-size:12px;padding:6px 12px}
    .btn-image{height:28px}
    
    .wrap{padding:0 8px 15px}
    .paper{padding:6px}
  }

  @media print{
    .bar,.toolbar{display:none !important}
    .version-label{display:none !important}
    body{background:#fff}
    .wrap{margin:0;padding:0;max-width:100%}
    .paper{border:0;padding:0;box-shadow:none}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="version-label">Software Version [V.21.1.0.3.0]</div>
  <div class="date" id="dateNow">—</div>
  <div class="id" id="pill">ID: —</div>
</div>

<div class="toolbar">
  <div class="status">Online Fit Certificate · <b id="statusName">loading…</b></div>
  <div class="toolbar-buttons">
    <button class="btn-image" id="downloadBtn" onclick="window.print()" title="Download / Print">
      <img src="header_banner.png" alt="Download / Print" style="height:36px;width:auto">
    </button>
    <a class="btn ghost" id="dlOrig" download>Download original</a>
  </div>
</div>

<div class="wrap" id="content">
  <div class="paper">
    <img id="img" alt="Medical report" style="display:none">
  </div>
</div>

<div id="err" style="display:none"><div class="err">
  <h3 style="margin:0 0 6px">Report not found</h3>
  <p style="margin:0">No report is available for the requested ID.</p>
</div></div>

<script>
  // Read ?id=... from the URL
  const params = new URLSearchParams(location.search);
  const id = (params.get("id") || "").trim();
  const folder = params.get("folder") || "reports";
  const ext = params.get("ext") || "jpeg";

  const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const today = new Date();
  document.getElementById("dateNow").textContent =
    String(today.getDate()).padStart(2,"0") + "-" + MONTHS[today.getMonth()] + "-" + today.getFullYear();

  if(!id){
    document.getElementById("content").style.display = "none";
    document.getElementById("err").style.display = "";
    document.getElementById("statusName").textContent = "no ID provided";
  } else {
    const src = folder + "/" + id + "." + ext;
    document.getElementById("pill").textContent = "ID: " + id;
    document.getElementById("statusName").textContent = "Patient " + id;
    document.getElementById("dlOrig").href = src;
    document.getElementById("dlOrig").download = id + "." + ext;

    const img = document.getElementById("img");
    img.onload = () => { img.style.display = "block"; };
    img.onerror = () => {
      document.getElementById("content").style.display = "none";
      document.getElementById("err").style.display = "";
      document.querySelector("#err .err p").textContent =
        "Image not found at " + src + ". Confirm the file exists on the server.";
    };
    img.src = src;
  }
</script>
</body>
</html>
