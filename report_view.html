<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Fit Certificate</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Arial','Helvetica',sans-serif;background:#eef1f3;color:#111}
  
  .site-header{background:#003D6C;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .site-header-left{display:flex;align-items:center;gap:12px}
  .site-logo{width:44px;height:44px;border-radius:50%;display:block}
  .site-brand{color:#fff;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;letter-spacing:.3px}
  .site-header-right{display:flex;align-items:center;gap:26px}
  .date-badge{display:flex;align-items:center;gap:6px;color:#fff;font-family:Georgia,'Times New Roman',serif;font-size:14px}
  .date-badge svg{flex:none}
  .user-menu{position:relative}
  .user-trigger{background:none;border:0;display:flex;align-items:center;gap:6px;color:#fff;font-family:Georgia,'Times New Roman',serif;font-size:14px;cursor:pointer;padding:4px 2px}
  .user-trigger svg{flex:none}
  .user-dropdown{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #d5dbe0;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.18);min-width:170px;overflow:hidden;z-index:20}
  .user-dropdown.open{display:block}
  .user-dropdown a{display:block;padding:10px 16px;color:#222;text-decoration:none;font-family:'Arial','Helvetica',sans-serif;font-size:13px}
  .user-dropdown a:hover{background:#f0f4f8}
  .accent-line{height:4px;background:#08B3C4}

  .toolbar{display:block;width:calc(100% - 40px);max-width:1400px;margin:14px auto;padding:12px 16px;background:#fff;border:2px solid #39AA42;border-radius:8px;color:#39AA42;font-weight:700;font-size:15px;font-family:'Arial','Helvetica',sans-serif;text-align:center;cursor:pointer;transition:background .2s ease,color .2s ease}
  .toolbar:hover{background:#39AA42;color:#fff}
  .toolbar-content{display:inline-flex;align-items:center;gap:8px}
  .toolbar-icon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
  
  .wrap{max-width:1400px;margin:16px auto;padding:0 12px 30px}
  .paper{background:#fff;border:1px solid #cfd4d8;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:10px;text-align:center}
  .paper img{max-width:100%;height:auto;display:block;margin:0 auto}
  
  .err{background:#fff;border:1px solid #f0c8c8;color:#8a2c2c;padding:20px;border-radius:6px;text-align:center;max-width:520px;margin:60px auto}
  
  /* Responsive Design */
  @media (max-width:768px){
    .site-header{padding:10px 14px}
    .site-brand{font-size:16px}
    .site-header-right{gap:16px}
    .date-badge,.user-trigger{font-size:12px}

    .wrap{padding:0 10px 20px;margin:12px auto}
    .paper{padding:8px}
  }

  @media (max-width:480px){
    .site-header{flex-direction:column;align-items:flex-start}
    .site-logo{width:36px;height:36px}
    .site-brand{font-size:14px}
    .site-header-right{gap:14px}

    .wrap{padding:0 8px 15px}
    .paper{padding:6px}
  }

  @media print{
    .site-header{display:none !important}
    .accent-line{display:none !important}
    .toolbar{display:none !important}
    body{background:#fff}
    .wrap{margin:0;padding:0;max-width:100%}
    .paper{border:0;padding:0;box-shadow:none}
  }
</style>
</head>
<body>

<div class="site-header">
  <div class="site-header-left">
    <img class="site-logo" src="site_logo.png" alt="Etihad Medical Center logo">
    <span class="site-brand">ETIHAD MEDICAL CENTER LTD.</span>
  </div>
  <div class="site-header-right">
    <span class="date-badge">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span id="liveDate"></span>
    </span>
    <div class="user-menu">
      <button class="user-trigger" id="userTrigger" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
        nobody
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="user-dropdown" id="userDropdown">
        <a href="#" onclick="return false;">Password change</a>
        <a href="#" onclick="return false;">Logout</a>
      </div>
    </div>
  </div>
</div>
<div class="accent-line"></div>

<button type="button" class="toolbar" onclick="window.print()" title="Download / Print">
  <span class="toolbar-content">
    Download/Print
    <span class="toolbar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>
    </span>
  </span>
</button>

<div class="wrap" id="content">
  <div class="paper">
    <img id="img" alt="Medical report" style="display:none">
  </div>
</div>

<div id="err" style="display:none"><div class="err">
  <h3 style="margin:0 0 6px">Report not found</h3>
  <p style="margin:0">No report is available for the requested ID.</p>
</div></div>

<script>
  // Read ?id=... from the URL
  const params = new URLSearchParams(location.search);
  const id = (params.get("id") || "").trim();
  const folder = params.get("folder") || "reports";
  const ext = params.get("ext") || "jpeg";

  if(!id){
    document.getElementById("content").style.display = "none";
    document.getElementById("err").style.display = "";
  } else {
    const src = folder + "/" + id + "." + ext;

    const img = document.getElementById("img");
    img.onload = () => { img.style.display = "block"; };
    img.onerror = () => {
      document.getElementById("content").style.display = "none";
      document.getElementById("err").style.display = "";
      document.querySelector("#err .err p").textContent =
        "Image not found at " + src + ". Confirm the file exists on the server.";
    };
    img.src = src;
  }

  // Live date badge (matches DD-MMM-YYYY style, e.g. 17-AUG-2026)
  const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const now = new Date();
  const dd = String(now.getDate()).padStart(2, "0");
  document.getElementById("liveDate").textContent = `${dd}-${MONTHS[now.getMonth()]}-${now.getFullYear()}`;

  // "nobody" account dropdown
  const userTrigger = document.getElementById("userTrigger");
  const userDropdown = document.getElementById("userDropdown");
  userTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    userDropdown.classList.toggle("open");
  });
  document.addEventListener("click", () => userDropdown.classList.remove("open"));
</script>
</body>
</html>
